<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yllead — Walid Ait Miloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1c1c1e;
    --surface:  #242426;
    --surface2: #2c2c2e;
    --border:   rgba(237,237,237,0.08);
    --text:     #ededed;
    --muted:    rgba(237,237,237,0.38);
    --hint:     rgba(237,237,237,0.10);
    --radius:   14px;
  }

  html, body {
    min-height: 100vh;
    background: transparent;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    pointer-events: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.52);
    z-index: 0;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(237,237,237,0.03) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  /* ── CARD ── */
  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(28,28,30,0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 36px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.65s cubic-bezier(0.22,1,0.36,1) 0.08s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── AVATAR ── */
  .avatar {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ── NAME + BIO ── */
  .name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 10px;
  }

  .bio {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    text-align: center;
    line-height: 1.65;
    margin-bottom: 28px;
    max-width: 300px;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 20px;
  }

  /* ── LINKS ── */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 15px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.01em;
    transition: background 0.16s, border-color 0.16s, transform 0.16s;
    position: relative;
  }

  .link::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 40%, rgba(237,237,237,0.035) 100%);
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: inherit;
  }

  .link:hover {
    background: #313133;
    border-color: rgba(237,237,237,0.13);
  }

  .link:hover::before { opacity: 1; }
  .link:active { transform: scale(0.985); }

  /* featured link — Zellige */
  .link.featured {
    border-color: rgba(237,237,237,0.14);
    background: #2a2a2c;
  }
  .link.featured:hover {
    border-color: rgba(237,237,237,0.22);
    background: #323234;
  }

  .link-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--hint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg {
    width: 15px;
    height: 15px;
    fill: var(--text);
  }

  .link-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .link-label { font-size: 13.5px; font-weight: 400; }
  .link-sub { font-size: 11px; color: var(--muted); }

  /* Zellige link hover color */
  .link.featured:hover .link-label,
  .link.featured:hover .link-sub {
    color: #d0ff14;
    transition: color 0.16s;
  }

  /* ── FOOTER ── */
  .foot {
    margin-top: 20px;
    font-size: 11px;
    color: rgba(237,237,237,0.18);
    letter-spacing: 0.03em;
    opacity: 0;
    animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 18px 22px; border-radius: 18px; }
  }

</style>
</head>
